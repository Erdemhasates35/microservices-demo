# Copyright 2024 Automated Enhancement
#
# Automated Multi-Environment Deployment
# Smart deployment automation with rollback capabilities

name: "Automated Deployment Pipeline"
on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (skip safety checks)'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID: "online-boutique-ci"
  STAGING_CLUSTER: "staging-cluster"
  PROD_CLUSTER: "prod-cluster"
  REGION: "us-central1"

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  pre-deployment-checks:
    name: Pre-deployment Safety Checks
    runs-on: ubuntu-latest
    outputs:
      deploy-staging: ${{ steps.determine-deploy.outputs.deploy-staging }}
      deploy-prod: ${{ steps.determine-deploy.outputs.deploy-prod }}
      safety-checks: ${{ steps.safety-check.outputs.passed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine deployment targets
      id: determine-deploy
      run: |
        deploy_staging="false"
        deploy_prod="false"
        
        # Deploy to staging on main branch push or PR with deploy-staging label
        if [ "${{ github.ref }}" = "refs/heads/main" ] || \
           [ "${{ github.event_name }}" = "pull_request" ] && \
           echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q "deploy-staging"; then
          deploy_staging="true"
        fi
        
        # Deploy to production on main branch with deploy-prod label or manual trigger
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "production" ]; then
          deploy_prod="true"
        elif [ "${{ github.ref }}" = "refs/heads/main" ] && \
             echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q "deploy-production"; then
          deploy_prod="true"
        fi
        
        echo "deploy-staging=$deploy_staging" >> $GITHUB_OUTPUT
        echo "deploy-prod=$deploy_prod" >> $GITHUB_OUTPUT
        
        echo "Deployment plan:"
        echo "- Staging: $deploy_staging"
        echo "- Production: $deploy_prod"

    - name: Safety checks
      id: safety-check
      run: |
        echo "Running pre-deployment safety checks..."
        
        safety_score=100
        issues=()
        
        # Check for breaking changes
        if git log --oneline origin/main~5..HEAD | grep -i "breaking\|major"; then
          echo "⚠️ Potential breaking changes detected"
          safety_score=$((safety_score - 20))
          issues+=("Breaking changes detected")
        fi
        
        # Check commit frequency (too many commits in short time might indicate issues)
        recent_commits=$(git log --since="1 hour ago" --oneline | wc -l)
        if [ "$recent_commits" -gt 10 ]; then
          echo "⚠️ High commit frequency detected ($recent_commits commits in last hour)"
          safety_score=$((safety_score - 10))
          issues+=("High commit frequency")
        fi
        
        # Check for security-related commits
        if git log --oneline -10 | grep -i "security\|vulnerability\|cve"; then
          echo "✅ Security fixes detected - prioritizing deployment"
          safety_score=$((safety_score + 10))
        fi
        
        # Check test status (would normally check CI status)
        echo "✅ Safety checks completed with score: $safety_score/100"
        
        # Pass if score is above 70 or force deploy is enabled
        if [ "$safety_score" -ge 70 ] || [ "${{ inputs.force_deploy }}" = "true" ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
        else
          echo "passed=false" >> $GITHUB_OUTPUT
        fi
        
        # Save issues for later use
        printf '%s\n' "${issues[@]}" > safety_issues.txt

    - name: Upload safety report
      uses: actions/upload-artifact@v4
      with:
        name: safety-report
        path: safety_issues.txt

  build-and-push-images:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.safety-checks == 'true'
    strategy:
      matrix:
        service: [
          'emailservice',
          'productcatalogservice',
          'recommendationservice',
          'shippingservice',
          'checkoutservice',
          'paymentservice',
          'currencyservice',
          'cartservice',
          'frontend',
          'adservice',
          'loadgenerator'
        ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for GCR
      run: |
        gcloud auth configure-docker us-docker.pkg.dev --quiet

    - name: Build and push image
      run: |
        SERVICE="${{ matrix.service }}"
        IMAGE_TAG="us-docker.pkg.dev/$PROJECT_ID/microservices/$SERVICE:${{ github.sha }}"
        LATEST_TAG="us-docker.pkg.dev/$PROJECT_ID/microservices/$SERVICE:latest"
        
        echo "Building $SERVICE..."
        
        if [ "$SERVICE" = "cartservice" ]; then
          BUILD_CONTEXT="src/$SERVICE/src"
        else
          BUILD_CONTEXT="src/$SERVICE"
        fi
        
        # Build with cache optimization
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --push \
          --tag "$IMAGE_TAG" \
          --tag "$LATEST_TAG" \
          "$BUILD_CONTEXT"
        
        echo "Successfully built and pushed $IMAGE_TAG"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks, build-and-push-images]
    if: |
      needs.pre-deployment-checks.outputs.deploy-staging == 'true' &&
      needs.pre-deployment-checks.outputs.safety-checks == 'true'
    environment:
      name: staging
      url: http://staging.microservices-demo.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $STAGING_CLUSTER \
          --region $REGION \
          --project $PROJECT_ID

    - name: Create namespace if not exists
      run: |
        kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        
        # Update image tags in manifests
        SERVICES="emailservice productcatalogservice recommendationservice shippingservice checkoutservice paymentservice currencyservice cartservice frontend adservice loadgenerator"
        
        for service in $SERVICES; do
          sed -i "s|image: $service$|image: us-docker.pkg.dev/$PROJECT_ID/microservices/$service:${{ github.sha }}|g" kubernetes-manifests/*.yaml
        done
        
        # Deploy to staging namespace
        kubectl apply -f kubernetes-manifests/ -n staging
        
        # Wait for rollout to complete
        kubectl rollout status deployment --all -n staging --timeout=600s

    - name: Run health checks
      run: |
        echo "Running health checks..."
        
        # Wait for external IP
        echo "Waiting for LoadBalancer IP..."
        for i in {1..30}; do
          EXTERNAL_IP=$(kubectl get service frontend-external -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$EXTERNAL_IP" ]; then
            echo "External IP: $EXTERNAL_IP"
            break
          fi
          echo "Waiting for external IP... ($i/30)"
          sleep 10
        done
        
        if [ -z "$EXTERNAL_IP" ]; then
          echo "Failed to get external IP"
          exit 1
        fi
        
        # Health check
        echo "Performing health check..."
        for i in {1..10}; do
          if curl -f "http://$EXTERNAL_IP" > /dev/null 2>&1; then
            echo "✅ Staging deployment successful!"
            echo "staging_url=http://$EXTERNAL_IP" >> $GITHUB_ENV
            break
          fi
          echo "Health check attempt $i/10 failed, retrying..."
          sleep 15
        done

    - name: Create deployment record
      run: |
        echo "# 🚀 Staging Deployment Report" > staging_deployment_report.md
        echo "" >> staging_deployment_report.md
        echo "**Deployment ID:** ${{ github.sha }}" >> staging_deployment_report.md
        echo "**Timestamp:** $(date -u)" >> staging_deployment_report.md
        echo "**Environment:** Staging" >> staging_deployment_report.md
        echo "**Status:** ✅ Successful" >> staging_deployment_report.md
        echo "" >> staging_deployment_report.md
        if [ -n "$staging_url" ]; then
          echo "**Access URL:** $staging_url" >> staging_deployment_report.md
        fi
        echo "" >> staging_deployment_report.md
        echo "## Services Deployed:" >> staging_deployment_report.md
        kubectl get deployments -n staging -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,UP-TO-DATE:.status.updatedReplicas >> staging_deployment_report.md

    - name: Comment on PR if applicable
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('staging_deployment_report.md', 'utf8');
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks, build-and-push-images, deploy-staging]
    if: |
      always() &&
      needs.pre-deployment-checks.outputs.deploy-prod == 'true' &&
      needs.pre-deployment-checks.outputs.safety-checks == 'true' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment:
      name: production
      url: http://microservices-demo.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $PROD_CLUSTER \
          --region $REGION \
          --project $PROJECT_ID

    - name: Create backup of current production
      run: |
        echo "Creating backup of current production deployment..."
        kubectl get all -o yaml > production_backup_${{ github.sha }}.yaml
        
        # Store current image versions for potential rollback
        kubectl get deployments -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.template.spec.containers[0].image}{"\n"}{end}' > current_versions.txt

    - name: Deploy to production with rolling update
      run: |
        echo "Deploying to production with rolling update strategy..."
        
        # Update image tags in manifests
        SERVICES="emailservice productcatalogservice recommendationservice shippingservice checkoutservice paymentservice currencyservice cartservice frontend adservice loadgenerator"
        
        for service in $SERVICES; do
          sed -i "s|image: $service$|image: us-docker.pkg.dev/$PROJECT_ID/microservices/$service:${{ github.sha }}|g" kubernetes-manifests/*.yaml
        done
        
        # Apply with rolling update
        kubectl apply -f kubernetes-manifests/
        
        # Monitor rollout for each deployment
        DEPLOYMENTS=$(kubectl get deployments -o jsonpath='{.items[*].metadata.name}')
        for deployment in $DEPLOYMENTS; do
          echo "Monitoring rollout for $deployment..."
          kubectl rollout status deployment/$deployment --timeout=600s
          
          # Wait between deployments to ensure stability
          sleep 30
        done

    - name: Production health checks
      run: |
        echo "Running comprehensive production health checks..."
        
        # Get external IP
        EXTERNAL_IP=$(kubectl get service frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Production URL: http://$EXTERNAL_IP"
        
        # Health checks
        health_checks_passed=0
        total_checks=5
        
        for i in $(seq 1 $total_checks); do
          echo "Health check $i/$total_checks..."
          
          if curl -f -s "http://$EXTERNAL_IP" > /dev/null; then
            health_checks_passed=$((health_checks_passed + 1))
            echo "✅ Check $i passed"
          else
            echo "❌ Check $i failed"
          fi
          
          sleep 30
        done
        
        success_rate=$((health_checks_passed * 100 / total_checks))
        echo "Health check success rate: $success_rate%"
        
        if [ $success_rate -lt 80 ]; then
          echo "Health checks failed - initiating rollback"
          exit 1
        fi
        
        echo "production_url=http://$EXTERNAL_IP" >> $GITHUB_ENV

    - name: Create production deployment record
      run: |
        echo "# 🎉 Production Deployment Report" > production_deployment_report.md
        echo "" >> production_deployment_report.md
        echo "**Deployment ID:** ${{ github.sha }}" >> production_deployment_report.md
        echo "**Timestamp:** $(date -u)" >> production_deployment_report.md
        echo "**Environment:** Production" >> production_deployment_report.md
        echo "**Status:** ✅ Successful" >> production_deployment_report.md
        echo "" >> production_deployment_report.md
        if [ -n "$production_url" ]; then
          echo "**Access URL:** $production_url" >> production_deployment_report.md
        fi
        echo "" >> production_deployment_report.md
        echo "## Deployment Health:" >> production_deployment_report.md
        kubectl get deployments -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,UP-TO-DATE:.status.updatedReplicas >> production_deployment_report.md

    - name: Store deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-deployment-${{ github.sha }}
        path: |
          production_backup_${{ github.sha }}.yaml
          current_versions.txt
          production_deployment_report.md

  rollback-on-failure:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()
    environment:
      name: production
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $PROD_CLUSTER \
          --region $REGION \
          --project $PROJECT_ID

    - name: Perform rollback
      run: |
        echo "🚨 Performing emergency rollback..."
        
        # Rollback all deployments to previous version
        DEPLOYMENTS=$(kubectl get deployments -o jsonpath='{.items[*].metadata.name}')
        for deployment in $DEPLOYMENTS; do
          echo "Rolling back $deployment..."
          kubectl rollout undo deployment/$deployment
          kubectl rollout status deployment/$deployment --timeout=300s
        done
        
        echo "✅ Rollback completed"

    - name: Notify about rollback
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'failure',
            target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            description: 'Production deployment failed - automatic rollback performed',
            context: 'deployment/production'
          });

  post-deployment:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
    - name: Create deployment summary
      run: |
        echo "# 🚀 Deployment Summary" > deployment_summary.md
        echo "" >> deployment_summary.md
        echo "**Commit:** ${{ github.sha }}" >> deployment_summary.md
        echo "**Triggered by:** ${{ github.event_name }}" >> deployment_summary.md
        echo "**Timestamp:** $(date -u)" >> deployment_summary.md
        echo "" >> deployment_summary.md
        echo "## Results:" >> deployment_summary.md
        
        if [ "${{ needs.deploy-staging.result }}" = "success" ]; then
          echo "✅ **Staging deployment:** Successful" >> deployment_summary.md
        elif [ "${{ needs.deploy-staging.result }}" = "skipped" ]; then
          echo "⏭️ **Staging deployment:** Skipped" >> deployment_summary.md
        else
          echo "❌ **Staging deployment:** Failed" >> deployment_summary.md
        fi
        
        if [ "${{ needs.deploy-production.result }}" = "success" ]; then
          echo "✅ **Production deployment:** Successful" >> deployment_summary.md
        elif [ "${{ needs.deploy-production.result }}" = "skipped" ]; then
          echo "⏭️ **Production deployment:** Skipped" >> deployment_summary.md
        else
          echo "❌ **Production deployment:** Failed" >> deployment_summary.md
        fi
        
        echo "" >> deployment_summary.md
        echo "*Automated deployment completed by Deployment Bot 🤖*" >> deployment_summary.md

    - name: Upload deployment summary
      uses: actions/upload-artifact@v4
      with:
        name: deployment-summary
        path: deployment_summary.md